# 法兰标准库 · Nginx 站点配置（HTTP，证书由 certbot --nginx 自动补全）
#
# 安装：
#   sudo cp deploy/nginx-flange-std.conf /etc/nginx/sites-available/flange-std
#   sudo sed -i 's/__DOMAIN__/std.example.com/g' /etc/nginx/sites-available/flange-std
#   sudo ln -sf /etc/nginx/sites-available/flange-std /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d std.example.com
#
# 如果和已有站点共用一台服务器：不要删 default，也不要重复写 listen 80 default_server。

upstream flange_std {
    server 127.0.0.1:8011;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    charset utf-8;
    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Django collectstatic 的产物，Nginx 直接发，长缓存
    location /static/ {
        alias /srv/flange-std/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 健康检查：监控用，不写访问日志
    location = /healthz {
        proxy_pass http://flange_std;
        access_log off;
    }

    # 后台建议只允许公司出口 IP / VPN 访问；把下面 4 行的注释去掉并换成你的网段。
    # 不限制也可以，后台仍有 Django 登录，但会暴露登录页。
    # location ^~ /admin/ {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://flange_std;
    #     include /etc/nginx/proxy_params;
    # }

    location / {
        proxy_pass http://flange_std;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 证书签好、HTTPS 正常后打开 HSTS（DJANGO_HTTPS=1 时 Django 也会发）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
