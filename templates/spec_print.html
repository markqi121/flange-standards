{% load static catalog_extras %}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规格卡 {{ row.title_zh }} · A4 打印</title>
  <link rel="stylesheet" href="{% static 'css/print.css' %}?v=20261105b">
</head>
<body class="print-body">

  <div class="print-toolbar">
    <div class="toolbar-inner">
      <span class="toolbar-title">A4 规格卡预览</span>
      <span class="toolbar-hint">打印设置：A4 · 纵向 · 边距“无/默认” · 关闭浏览器页眉页脚 · 缩放 100%</span>
      <div class="toolbar-actions">
        <a class="toolbar-btn" href="{{ row.get_absolute_url }}">返回详情</a>
        <a class="toolbar-btn toolbar-btn-primary" id="pdf-link" href="{{ pdf_url }}">下载 PDF</a>
        <button class="toolbar-btn" id="print-button" type="button">打印</button>
        <button class="toolbar-btn" id="copy-link" type="button">复制链接</button>
      </div>
      {% if series.groups|length > 1 %}
        <form class="toolbar-group" method="get" action="">
          <label for="print-group">材料组</label>
          <select id="print-group" name="group" onchange="this.form.submit()">
            {% for g in series.groups %}
              <option value="{{ g.code }}" {% if g.code == series.group %}selected{% endif %} title="{{ g.materials }}">{{ g.code }}</option>
            {% endfor %}
          </select>
        </form>
      {% endif %}
    </div>
    <p class="print-hint" id="print-hint" hidden>iPhone / iPad 不支持网页直接打印：请点上方「下载 PDF」，再在文件 App 里分享或打印；也可以「复制链接」到电脑上打印。</p>
  </div>

  {% include "partials/print_sheet.html" %}

  <script>
    (function () {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var hint = document.getElementById('print-hint');
      var printButton = document.getElementById('print-button');
      var copyButton = document.getElementById('copy-link');

      if (hint && isIOS) { hint.hidden = false; }

      if (printButton) {
        printButton.addEventListener('click', function () {
          if (isIOS || typeof window.print !== 'function') {
            if (hint) { hint.hidden = false; hint.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            return;
          }
          window.print();
        });
      }

      var pdfLink = document.getElementById('pdf-link');
      if (pdfLink) {
        pdfLink.addEventListener('click', function () {
          pdfLink.textContent = '正在生成…';
          setTimeout(function () { pdfLink.textContent = '下载 PDF'; }, 8000);
        });
      }

      if (copyButton) {
        copyButton.addEventListener('click', function () {
          var text = window.location.href;
          var done = function () {
            copyButton.textContent = '已复制';
            setTimeout(function () { copyButton.textContent = '复制链接'; }, 1800);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () { window.prompt('复制链接', text); });
          } else {
            window.prompt('复制链接', text);
          }
        });
      }
    })();
  </script>
</body>
</html>
